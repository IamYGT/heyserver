[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hserver-telegram-bot"
version = "0.3.0"
description = "Telegram control plane for hserver-panel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=21.6,<22",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-httpx>=0.30,<1",
  "respx>=0.21,<1",
]

[project.scripts]
hserver-bot = "hserver_bot.__main__:main"
hserver-bot-notify = "hserver_bot.cli_notify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
